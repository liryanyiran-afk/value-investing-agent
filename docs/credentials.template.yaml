# 终端 API 凭证模板
#
# 复制到 ~/.config/vi-agent/credentials.yaml 并填实
# 此文件本身在 git 仓外, 永远不入仓
#
# 用法:
#   export VI_AGENT_CREDS=~/.config/vi-agent/credentials.yaml
#   scripts/bridge.py --creds "$VI_AGENT_CREDS" --query ...

wind:
  enabled: true
  account_id: "your_wind_account"
  password: "your_wind_password"  # 或 token
  endpoint: "wind.pfx.com.cn"  # 视实际

bloomberg:
  enabled: false  # 如有 license 改 true
  api_host: "localhost"
  api_port: 8194

choice:
  enabled: false
  account: ""
  password: ""

ifind:
  enabled: false
  account: ""
  password: ""
